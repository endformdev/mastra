name: Fork Studio browser tests

on:
  pull_request:
    branches: [main, 'codex/mastra-playwright-baseline']
  workflow_dispatch:

permissions: {}

jobs:
  e2e-kitchen-sink:
    name: Endform kitchen-sink
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: local:rw
      E2E_APP_POOL_SIZE: '8'

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record runner resources
        run: |
          nproc
          free -h

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build
        run: >-
          pnpm turbo
          --filter "@mastra/core"
          --filter "mastra"
          --filter "@mastra/editor"
          --filter "@mastra/memory"
          --filter "@mastra/libsql"
          --filter "@mastra/loggers"
          --filter "@mastra/mcp"
          --filter "@internal/playground"
          build

      - name: Setup e2e project dependencies
        working-directory: ./packages/playground
        run: pnpm install --dir ./e2e/kitchen-sink --frozen-lockfile

      - name: Verify application isolation
        run: node --test packages/playground/e2e/isolation-server.test.mjs

      - name: Test E2E
        working-directory: ./packages/playground
        run: pnpm test:e2e:endform

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-endform
          path: packages/playground/test-results/
          if-no-files-found: ignore
